[package]
name = "capturador-pantalla"
version = "1.0.0"
description = "Capturador de Pantalla Corporativo Open Source"
authors = ["Julio Cesar Cisneros Palomino <cispal19@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "capturador_pantalla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
